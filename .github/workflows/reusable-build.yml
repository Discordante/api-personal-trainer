name: reusable-build

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image_name:
        required: true
        type: string
      channel_branch:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      tag_channel:
        value: ${{ jobs.build.outputs.tag_channel }}
      tag_version:
        value: ${{ jobs.build.outputs.tag_version }}
      tag_sha:
        value: ${{ jobs.build.outputs.tag_sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag_channel: ${{ steps.tags.outputs.tag_channel }}
      tag_version: ${{ steps.tags.outputs.tag_version }}
      tag_sha: ${{ steps.tags.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: tags
        shell: bash
        run: |
          IMAGE_LC="$(echo "${{ inputs.image_name }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ inputs.registry }}/${IMAGE_LC}"

          case "${{ inputs.channel_branch }}" in
            develop)  CHANNEL=beta ;;
            staging)  CHANNEL=rc ;;
            main)     CHANNEL=latest ;;
            *)        CHANNEL=dev ;;
          esac

          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          echo "image=${IMAGE}"                             >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}"                         >> "$GITHUB_OUTPUT"
          echo "tag_channel=${IMAGE}:${CHANNEL}"            >> "$GITHUB_OUTPUT"
          echo "tag_version=${IMAGE}:${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE}:sha-${SHA_SHORT}"          >> "$GITHUB_OUTPUT"   # <- FIX

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.tags.outputs.image }}
          tags: |
            type=raw,value=${{ steps.tags.outputs.channel }}
            type=raw,value=${{ inputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.tags.outputs.tag_channel }}
            ${{ steps.tags.outputs.tag_version }}
            ${{ steps.tags.outputs.tag_sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ inputs.version }}

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.26.0
        with:
          image-ref: ${{ steps.tags.outputs.tag_sha }}
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: true
          exit-code: 0
